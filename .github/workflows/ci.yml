name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual re-deploy of main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, tests, coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: splitkit
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: splitkit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U splitkit -d splitkit"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      SPLITKIT_PG_DSN: postgresql://splitkit:ci_only_password@127.0.0.1:5432/splitkit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv venv && uv pip install -e ".[dev]" ruff
      - name: Lint
        run: uv run --no-sync ruff check src tests scripts
      - name: Test (unit + Postgres integration)
        run: uv run --no-sync pytest --cov=src --cov-report=term-missing --cov-fail-under=80

  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test   # includes the cross-language assignment vectors
      - run: npm run build

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [python, sdk, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: false
          tags: splitkit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Ships main to ECS Fargate (infra/terraform). Skipped until the repository
  # variables AWS_DEPLOY_ROLE_ARN, AWS_REGION and SPLITKIT_URL are set, so CI
  # stays green before (and after) the AWS stack exists.
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [image]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_REGION != '' && vars.SPLITKIT_URL != ''
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> short-lived AWS credentials; no stored keys
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      ECS_CLUSTER: splitkit
      ECS_SERVICE: splitkit
      TASK_FAMILY: splitkit
      CONTAINER: app
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      # Tags are immutable: on a re-run for the same commit, reuse the image.
      - id: exists
        name: Check for an existing image
        run: |
          if aws ecr describe-images --repository-name splitkit \
               --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.found != 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build and push image
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/splitkit:${{ github.sha }}
          cache-from: type=gha
      # Start from the latest revision so env changes made in Terraform carry over.
      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query taskDefinition > taskdef.json
      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: taskdef.json
          container-name: ${{ env.CONTAINER }}
          image: ${{ steps.ecr.outputs.registry }}/splitkit:${{ github.sha }}
      - name: Roll the service (circuit breaker rolls back on failure)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
      - name: Smoke test
        env:
          SPLITKIT_URL: ${{ vars.SPLITKIT_URL }}
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "$SPLITKIT_URL/health"
