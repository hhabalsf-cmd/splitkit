name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, tests, coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: splitkit
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: splitkit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U splitkit -d splitkit"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      SPLITKIT_PG_DSN: postgresql://splitkit:ci_only_password@127.0.0.1:5432/splitkit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv venv && uv pip install -e ".[dev]" ruff
      - name: Lint
        run: uv run --no-sync ruff check src tests scripts
      - name: Test (unit + Postgres integration)
        run: uv run --no-sync pytest --cov=src --cov-report=term-missing --cov-fail-under=80

  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test   # includes the cross-language assignment vectors
      - run: npm run build

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [python, sdk, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: false
          tags: splitkit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
