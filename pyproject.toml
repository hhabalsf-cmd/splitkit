[project]
name = "splitkit"
version = "0.1.0"
description = "Self-hostable A/B experimentation platform"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# HTTP service (what the Docker image installs)
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
]
# offline analysis of public datasets
analysis = ["duckdb>=1.1", "pandas>=2.2"]
dev = [
    "splitkit[api,analysis]",
    "pytest>=8",
    "pytest-cov>=5",
    "statsmodels>=0.14",
    "httpx>=0.27",
    "locust>=2.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splitkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["integration: needs a running Postgres (SPLITKIT_PG_DSN)"]
filterwarnings = [
    # starlette suggests an unvetted "httpx2" package; httpx works fine for TestClient
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
